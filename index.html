<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ensemble">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Men's Ensemble</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1f2328; --muted:#667085; --line:#e2e5e9;
  --empty:#eceef1; --hi:#2563eb; --danger:#c62828;
  --P:#16a34a; --L:#f2b705; --E:#64748b; --A:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141619; --panel:#1d2024; --ink:#e8eaed; --muted:#98a2ad; --line:#2d3137; --empty:#262a30; --hi:#60a5fa; --danger:#ef5350; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  display:flex; flex-direction:column; overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;white-space:nowrap}
h2{font-size:19px;margin:0 0 14px}
.tabs{display:flex;background:var(--empty);border-radius:10px;padding:3px;margin:0 auto}
.tabs button{border:0;background:none;padding:8px 20px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;white-space:nowrap;position:relative}
.btn:active{opacity:.6}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.35}
.dot-alert{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#f59e0b;border:2px solid var(--panel)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar select, .toolbar input[type=date]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font-weight:600;max-width:220px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.spacer{flex:1}
.stepper{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:19px;line-height:1}
.stepper b{min-width:20px;text-align:center;color:var(--ink)}
.body{flex:1;min-height:0;display:flex}
.pool{width:230px;flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;border-right:1px solid var(--line);padding:12px;background:var(--panel)}
.stage{flex:1;min-width:0;overflow:auto;padding:16px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.ghead{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.ghead:first-of-type{margin-top:4px}
.ghead span.n{margin-left:auto;font-weight:600}
.dot{width:11px;height:11px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.chip{display:flex;flex-direction:column;padding:7px 10px;border-radius:9px;background:var(--empty);margin-bottom:6px;border-left:6px solid var(--pc);touch-action:pan-y}
.chip .fn{font-weight:700}
.chip .ln{font-size:12px;color:var(--muted)}
.chip.sel,.occ.sel{outline:3px solid var(--hi);outline-offset:1px}
.grid{display:grid;gap:6px;grid-template-columns:52px repeat(var(--cols),minmax(0,1fr))}
.rowlabel{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:700}
.seat{border-radius:10px;background:var(--empty);border:1.5px dashed var(--line);min-height:66px;display:flex;min-width:0}
.seat.full{border:0;background:none}
.seat.drop{outline:3px solid var(--hi);outline-offset:1px}
.occ{flex:1;min-width:0;border-radius:10px;background:var(--pc);color:#fff;padding:6px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;touch-action:none}
.occ .fn,.acell .fn{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ .ln,.acell .ln{font-size:11px;opacity:.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.director{grid-column:2/-1;text-align:center;margin-top:10px;padding:8px;border-top:3px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:13px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:.95;box-shadow:0 10px 28px rgba(0,0,0,.35);border-radius:10px}
.dragging{opacity:.25}
/* attendance */
.acell{border:0;border-radius:10px;min-height:66px;min-width:0;background:var(--empty);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-top:6px solid var(--pc);touch-action:manipulation}
.acell .st{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;opacity:.9}
.acell.s-P{background:var(--P);color:#fff}
.acell.s-L{background:var(--L);color:#2b2100}
.acell.s-E{background:var(--E);color:#fff}
.acell.s-A{background:var(--A);color:#fff}
.aempty{border-radius:10px;border:1.5px dashed var(--line);min-height:66px}
.offchart{margin-top:22px}
.offchart .cells{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--empty)}
.cnt i{width:10px;height:10px;border-radius:3px;background:var(--c)}
/* roster */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 40px}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input,.addform select,.field input{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 10px;width:150px}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-radius:10px;margin-bottom:6px}
.rrow .name{flex:1;text-align:left;background:none;border:0;padding:6px 0;font-weight:600;min-width:120px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pc);border-color:var(--pc);color:#fff}
.sectionhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:min(560px,100%);max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(820px,100%)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1;min-width:140px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack .btn{text-align:left;padding:12px 14px}
.stack .btn small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hrow b{min-width:160px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--muted);text-transform:uppercase;position:sticky;top:-22px;background:var(--panel)}
td:first-child,th:first-child{text-align:left}
.status-msg{padding:10px 12px;border-radius:10px;background:var(--empty);font-size:14px;margin-bottom:14px}
.sync{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync.warn{color:#d97706}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border-radius:18px;padding:32px;max-width:440px;width:100%;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.08)}
.card img{width:72px;height:72px;border-radius:16px;margin-bottom:12px}
.card p{color:var(--muted)}
.card .btn{margin-top:10px;padding:12px 20px;font-size:16px}
.erow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.erow span{flex:1;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){ .pool{width:180px} .tabs button{padding:8px 12px} h1{display:none} }
</style>
</head>
<body>
<header>
  <h1>Men's Ensemble</h1>
  <nav class="tabs" id="tabs" hidden>
    <button data-mode="seating">Seating</button>
    <button data-mode="attendance">Attendance</button>
    <button data-mode="roster">Roster</button>
  </nav>
  <span class="spacer" id="tabs-spacer"></span>
  <span class="sync" id="sync"></span>
  <button class="btn" data-action="settings" id="settings-btn" hidden>Settings</button>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, deleteField, FieldPath, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';

// ---------- Firebase setup ----------
const firebaseConfig = {
  "apiKey": "AIzaSyA1jK5qeh1fNoot1facw_TEYUI_6UmYfpE",
  "projectId": "mens-ensemble-hst13",
  "appId": "1:804689960274:web:14ef670cf054b6c6fbae8b",
  "storageBucket": "mens-ensemble-hst13.firebasestorage.app",
  "messagingSenderId": "804689960274",
  "authDomain": "mens-ensemble-hst13.web.app"
};
const APP_URL = 'https://mens-ensemble-hst13.web.app/';
if (APP_URL && location.hostname.endsWith('github.io')) location.replace(APP_URL);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
catch (e) { db = initializeFirestore(app, {}); }
const accessRef = doc(db, 'access', 'main');
const mainRef = doc(db, 'ensemble', 'main');
const rehCol = collection(db, 'ensemble', 'main', 'rehearsals');
const rehRef = date => doc(rehCol, date);

// ---------- constants ----------
const PARTS = [
  {id:'T1', name:'Tenor I',  color:'#2563eb'},
  {id:'T2', name:'Tenor II', color:'#0d9488'},
  {id:'BR', name:'Baritone', color:'#d97706'},
  {id:'BS', name:'Bass',     color:'#be185d'},
];
const NOPART = {id:'', name:'No part', color:'#8a929c'};
const ALLPARTS = [...PARTS, NOPART];
const PART_ORDER = {T1:0, T2:1, BR:2, BS:3, '':4};
const STATUS = {P:'Present', L:'Late', E:'Excused', A:'Absent'};
const STATUS_COLOR = {P:'var(--P)', L:'var(--L)', E:'var(--E)', A:'var(--A)'};
const CYCLE = [undefined, 'P', 'L', 'E', 'A'];
const LEGACY_KEY = 'mens-ensemble-v1';   // data saved on-device by the first version
const PREFS_KEY = 'mens-ensemble-prefs';

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const partOf = id => PARTS.find(p => p.id === id) || NOPART;
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s, opts){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString(undefined, opts || {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
const sortByPart = (a,b) => PART_ORDER[a.part]-PART_ORDER[b.part] || a.last.localeCompare(b.last) || a.first.localeCompare(b.first);
const sortByName = (a,b) => a.last.localeCompare(b.last) || a.first.localeCompare(b.first);
function readJSON(key){ try { return JSON.parse(localStorage.getItem(key)); } catch(e){ return null; } }
function writeJSON(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} }

// ---------- state ----------
function newChart(name, rows, cols){ return {id:uid(), name, rows, cols, seats:{}}; }
function cleanMembers(list){
  return (Array.isArray(list) ? list : []).map(m => ({id: m.id || uid(), first: m.first || '', last: m.last || '', part: m.part || '', active: m.active !== false}));
}
function cleanCharts(list){
  const charts = (Array.isArray(list) ? list : []).map(c => ({id: c.id || uid(), name: c.name || 'Chart', rows: c.rows || 4, cols: c.cols || 10, seats: c.seats || {}}));
  return charts.length ? charts : [newChart('Rehearsal', 4, 11)];
}

const prefs = readJSON(PREFS_KEY) || {};
let state = {members:[], charts:cleanCharts([]), rehearsals:{}, currentChartId:prefs.currentChartId};
const session = {phase:'loading', user:null, email:'', access:null, isOwner:false, error:'', mainLoaded:false, rehLoaded:false, pendingMain:false, pendingReh:false, fromCache:false, unsubs:[], legacyAsked:false};
const ui = { mode: prefs.mode || 'seating', selected:null, attDate:todayStr(), modal:null, modalLive:false };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const member = id => state.members.find(m => m.id === id);
const activeMembers = () => state.members.filter(m => m.active);
function curChart(){ return state.charts.find(c => c.id === state.currentChartId) || state.charts[0]; }
function setCurrentChart(id){ state.currentChartId = id; prefs.currentChartId = id; writeJSON(PREFS_KEY, prefs); }
const seatOf = (ch, mid) => Object.keys(ch.seats).find(k => ch.seats[k] === mid);

// ---------- cloud writes ----------
let errorShown = false;
function writeFailed(e){
  console.error(e);
  if (errorShown) return; errorShown = true;
  alert(e.code === 'permission-denied' ? 'Your account no longer has permission to make changes.' : 'Could not save a change: ' + e.message);
  setTimeout(() => errorShown = false, 5000);
}
function mainPayload(){ return {members: state.members, charts: state.charts, updatedAt: serverTimestamp(), updatedBy: session.email}; }
// Roster and seating changes: save the whole roster/charts document.
function commit(){ setDoc(mainRef, mainPayload()).catch(writeFailed); render(); }
// Attendance changes: write only the one singer's status, so two people can take attendance at once.
function setStatuses(date, changes){
  let reh = state.rehearsals[date];
  if (!reh) reh = state.rehearsals[date] = {chartId: rehearsalChart(date).id, records:{}};
  Object.entries(changes).forEach(([mid, s]) => { if (s) reh.records[mid] = s; else delete reh.records[mid]; });
  const ref = rehRef(date);
  if (!Object.keys(reh.records).length) { delete state.rehearsals[date]; deleteDoc(ref).catch(writeFailed); }
  else {
    const sets = Object.fromEntries(Object.entries(changes).filter(([, s]) => s));
    const clears = Object.keys(changes).filter(mid => !changes[mid]);
    if (Object.keys(sets).length) setDoc(ref, {chartId: reh.chartId, records: sets}, {merge:true}).catch(writeFailed);
    clears.forEach(mid => updateDoc(ref, new FieldPath('records', mid), deleteField()).catch(writeFailed));
  }
  render();
}

// Replace everything in the cloud with a backup (or this device's old data).
async function importData(data){
  const members = cleanMembers(data.members), charts = cleanCharts(data.charts);
  const rehearsals = data.rehearsals || {};
  const existing = await getDocs(rehCol);
  const ops = [b => b.set(mainRef, {members, charts, updatedAt: serverTimestamp(), updatedBy: session.email})];
  existing.forEach(d => { if (!rehearsals[d.id]) ops.push(b => b.delete(d.ref)); });
  Object.entries(rehearsals).forEach(([date, r]) => {
    if (r && r.records && Object.keys(r.records).length) ops.push(b => b.set(rehRef(date), {chartId: r.chartId || charts[0].id, records: r.records}));
  });
  for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i+400).forEach(op => op(b)); await b.commit(); }
  setCurrentChart(charts[0].id);
}

// ---------- auth & subscriptions ----------
function unsubscribeAll(){ session.unsubs.forEach(u => u()); session.unsubs = []; }
onAuthStateChanged(auth, async user => {
  unsubscribeAll();
  state = {members:[], charts:cleanCharts([]), rehearsals:{}, currentChartId:prefs.currentChartId};
  Object.assign(session, {user, email: user ? (user.email || '').toLowerCase() : '', access:null, isOwner:false, mainLoaded:false, rehLoaded:false});
  if (!user) { session.phase = 'signin'; return render(); }
  session.phase = 'loading'; render();
  try {
    const snap = await getDoc(accessRef);
    if (snap.exists()) session.access = snap.data();
    else { // first sign-in by the owner creates the access list (the security rules only allow the owner to do this)
      const a = {owner: session.email, editors: []};
      await setDoc(accessRef, a);
      session.access = a;
    }
  } catch (e) {
    session.phase = e.code === 'permission-denied' ? 'denied' : 'error';
    session.error = e.message;
    return render();
  }
  session.isOwner = session.access.owner === session.email;
  subscribe();
});

function subscribe(){
  session.unsubs.push(onSnapshot(accessRef, s => { if (s.exists()) { session.access = s.data(); if (ui.modal === settingsModal) settingsModal(); } }, () => {}));
  session.unsubs.push(onSnapshot(mainRef, {includeMetadataChanges:true}, s => {
    session.pendingMain = s.metadata.hasPendingWrites;
    session.fromCache = s.metadata.fromCache;
    if (s.exists()) {
      const d = s.data();
      state.members = cleanMembers(d.members);
      state.charts = cleanCharts(d.charts);
    }
    session.mainLoaded = true;
    maybeReady();
    if (!s.exists() && !s.metadata.fromCache) offerLegacyUpload();
  }, e => { session.phase = 'error'; session.error = e.message; render(); }));
  session.unsubs.push(onSnapshot(rehCol, {includeMetadataChanges:true}, qs => {
    session.pendingReh = qs.metadata.hasPendingWrites;
    const r = {};
    qs.forEach(d => { r[d.id] = d.data(); });
    state.rehearsals = r;
    session.rehLoaded = true;
    maybeReady();
  }, e => { session.phase = 'error'; session.error = e.message; render(); }));
}
function maybeReady(){
  if (session.mainLoaded && session.rehLoaded) session.phase = 'ready';
  render();
}
async function offerLegacyUpload(){
  if (session.legacyAsked) return;
  session.legacyAsked = true;
  const legacy = readJSON(LEGACY_KEY);
  if (!legacy || !Array.isArray(legacy.members) || !legacy.members.length) return;
  const n = Object.keys(legacy.rehearsals || {}).length;
  if (!confirm(`This device has ${legacy.members.length} singers and ${n} rehearsal(s) saved from before cloud sync.\n\nUpload them to your account now?`)) return;
  try { await importData(legacy); localStorage.removeItem(LEGACY_KEY); }
  catch (e) { alert('Upload failed: ' + e.message); }
}
async function doSignIn(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({prompt: 'select_account'});
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  try {
    if (standalone) await signInWithRedirect(auth, provider);
    else await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, provider);
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') alert('Sign-in failed: ' + e.message);
  }
}

// ---------- rendering ----------
let renderQueued = false;
function render(){
  if (drag && drag.started) { renderQueued = true; return; } // don't redraw under a finger mid-drag
  const ready = session.phase === 'ready';
  $('#tabs').hidden = !ready; $('#tabs-spacer').hidden = ready; $('#settings-btn').hidden = !session.user;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === ui.mode));
  const sync = $('#sync');
  if (!ready) { sync.textContent = ''; }
  else if (!navigator.onLine || session.fromCache) { sync.textContent = 'Offline · changes will sync'; sync.className = 'sync warn'; }
  else if (session.pendingMain || session.pendingReh) { sync.textContent = 'Saving…'; sync.className = 'sync'; }
  else { sync.textContent = 'All changes saved'; sync.className = 'sync'; }

  const keep = {};
  document.querySelectorAll('[data-scroll]').forEach(el => keep[el.dataset.scroll] = el.scrollTop);
  const v = $('#view');
  if (session.phase === 'signin') v.innerHTML = signinHTML();
  else if (session.phase === 'denied') v.innerHTML = deniedHTML();
  else if (session.phase === 'error') v.innerHTML = messageHTML('Can’t connect', esc(session.error) + '<br>Check the internet connection and reload.');
  else if (session.phase === 'loading') v.innerHTML = messageHTML('Loading…', '');
  else v.innerHTML = ui.mode === 'seating' ? seatingHTML() : ui.mode === 'attendance' ? attendanceHTML() : rosterHTML();
  document.querySelectorAll('[data-scroll]').forEach(el => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
  if (ui.modal && ui.modalLive) ui.modal();
}
window.addEventListener('online', render); window.addEventListener('offline', render);

function seatingHTML(){

function countRecords(rec, ids){

}

function totalsRows(){
  const dates = Object.keys(state.rehearsals);

    return {m, n, pct: marked ? Math.round((n.P + n.L) / marked * 100) : null};

// ---------- mutations ----------
function placeInSeat(mid, key){
  const ch = curChart();
  const from = seatOf(ch, mid), occupant = ch.seats[key];
  if (occupant === mid) return;
  if (from) delete ch.seats[from];
  ch.seats[key] = mid;
  if (occupant && from) ch.seats[from] = occupant;
  ui.selected = null;
  commit();
}
function unseat(mid){
  const ch = curChart(), k = seatOf(ch, mid);
  if (k) { delete ch.seats[k]; commit(); }
}
function resizeChart(dr, dc){
  const ch = curChart();
  ch.rows = Math.min(12, Math.max(1, ch.rows + dr));
  ch.cols = Math.min(24, Math.max(1, ch.cols + dc));
  Object.keys(ch.seats).forEach(k => { const [r,c] = k.split(',').map(Number); if (r >= ch.rows || c >= ch.cols) delete ch.seats[k]; });
  commit();
}
function cycleStatus(mid){
  const reh = state.rehearsals[ui.attDate];
  const cur = reh && reh.records[mid];
  setStatuses(ui.attDate, {[mid]: CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length] || null});
}

// ---------- files ----------
async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file]});
      return true;
    }
  } catch(e) { if (e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function attendanceCSV(){
  const dates = Object.keys(state.rehearsals).sort();
  const header = ['Last Name','First Name','Part','Member', ...dates, 'Present','Late','Excused','Absent','Attended %'];
  const rows = totalsRows().map(({m, n, pct}) => [m.last, m.first, partOf(m.part).name, m.active ? 'Current' : 'Former',
    ...dates.map(d => STATUS[(state.rehearsals[d].records || {})[m.id]] || ''), n.P, n.L, n.E, n.A, pct == null ? '' : pct]);
  return [header, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
$('#import-input').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.members) || !Array.isArray(data.charts)) throw new Error('This file is not a Men\'s Ensemble backup.');
    const when = data.exportedAt ? ` saved ${new Date(data.exportedAt).toLocaleString()}` : '';
    const msg = `Restore this backup${when}?\n\n${data.members.length} singers, ${data.charts.length} seating chart(s), ${Object.keys(data.rehearsals||{}).length} rehearsal(s).` +
      (state.members.length ? '\n\nThis replaces everything currently saved in your account, for everyone who uses the app.' : '');
    if (!confirm(msg)) return;
    await importData(data);
    closeModal();
  } catch(err) { alert('Could not restore: ' + err.message); }
});

// ---------- events ----------
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.classList.contains('backdrop')) return closeModal();
  const tab = t.closest('.tabs button');
  if (tab) { ui.mode = prefs.mode = tab.dataset.mode; writeJSON(PREFS_KEY, prefs); ui.selected = null; return render(); }

  const att = t.closest('[data-att]');
  if (att) return cycleStatus(att.dataset.att);

  // tap an empty seat while a singer is selected
  const seat = t.closest('[data-seat]');
  if (seat && !t.closest('[data-member]') && ui.selected) return placeInSeat(ui.selected, seat.dataset.seat);

  const a = t.closest('[data-action]'); if (!a) return;
  const ch = curChart(), id = a.dataset.id;
  switch (a.dataset.action){
    case 'signin': doSignIn(); break;
    case 'signout': closeModal(); await signOut(auth); break;
    case 'close': closeModal(); break;
    case 'settings': showModal(settingsModal, false); break;
    case 'import': $('#import-input').click(); break;
    case 'export-json':
      await saveFile(`Mens Ensemble Backup ${todayStr()}.json`, JSON.stringify({members: state.members, charts: state.charts, rehearsals: state.rehearsals, exportedAt: Date.now()}, null, 1), 'application/json');
      break;
    case 'export-csv': await saveFile(`Mens Ensemble Attendance ${todayStr()}.csv`, attendanceCSV(), 'text/csv'); break;
    case 'remove-editor': {
      const em = a.dataset.email;
      if (confirm(`Remove ${em}? They won't be able to open the app anymore.`)) {
        setDoc(accessRef, {...session.access, editors: (session.access.editors || []).filter(x => x !== em)}).catch(writeFailed);
      }
      break;
    }
    case 'chart-new': {
      const name = prompt('Name for the new seating chart:', ''); if (!name) break;
      const c = newChart(name.trim(), ch.rows, ch.cols); state.charts.push(c); setCurrentChart(c.id); commit(); break;
    }
    case 'chart-rename': { const name = prompt('Rename seating chart:', ch.name); if (name) { ch.name = name.trim(); commit(); } break; }
    case 'chart-dup': {
      const name = prompt('Name for the copy:', ch.name + ' copy'); if (!name) break;
      const c = {...newChart(name.trim(), ch.rows, ch.cols), seats:{...ch.seats}}; state.charts.push(c); setCurrentChart(c.id); commit(); break;
    }
    case 'chart-delete':
      if (state.charts.length > 1 && confirm(`Delete the seating chart "${ch.name}"? Attendance records are not affected.`)) {
        state.charts = state.charts.filter(c => c !== ch); setCurrentChart(state.charts[0].id); commit();
      }
      break;
    case 'chart-clear': if (confirm(`Remove everyone from the seats in "${ch.name}"?`)) { ch.seats = {}; commit(); } break;
    case 'rows': resizeChart(+a.dataset.d, 0); break;
    case 'cols': resizeChart(0, +a.dataset.d); break;
    case 'set-part': member(id).part = a.dataset.part; commit(); break;
    case 'unseat': closeModal(); unseat(id); break;
    case 'edit-member': showModal(() => editMemberModal(id), false); break;
    case 'remove-member': {
      const m = member(id);
      if (confirm(`Remove ${m.first} ${m.last} from the roster?\n\nThey'll be taken off every seating chart. Their past attendance is kept, and you can restore them later.`)) {
        m.active = false; state.charts.forEach(c => { const k = seatOf(c, id); if (k) delete c.seats[k]; }); commit();
      }
      break;
    }
    case 'restore-member': member(id).active = true; commit(); break;
    case 'purge-member': {
      const m = member(id);
      if (confirm(`Permanently delete ${m.first} ${m.last} and all of their attendance records? This cannot be undone.`)) {
        state.members = state.members.filter(x => x.id !== id);
        Object.keys(state.rehearsals).forEach(d => { if ((state.rehearsals[d].records || {})[id]) setStatuses(d, {[id]: null}); });
        commit();
      }
      break;
    }
    case 'goto-date': if (a.dataset.date) { ui.attDate = a.dataset.date; render(); } break;
    case 'mark-rest': {
      const rec = (state.rehearsals[ui.attDate] || {}).records || {};
      const changes = {};
      activeMembers().forEach(m => { if (!rec[m.id]) changes[m.id] = 'P'; });
      setStatuses(ui.attDate, changes);
      break;
    }
    case 'history': showModal(historyModal); break;
    case 'totals': showModal(totalsModal); break;
    case 'open-date': ui.attDate = a.dataset.date; closeModal(); render(); break;
    case 'delete-date':
      if (confirm(`Delete all attendance for ${fmtDate(a.dataset.date)}?`)) { delete state.rehearsals[a.dataset.date]; deleteDoc(rehRef(a.dataset.date)).catch(writeFailed); render(); }
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  switch (t.dataset.change){
    case 'chart': setCurrentChart(t.value); ui.selected = null; render(); break;
    case 'att-date': if (t.value) { ui.attDate = t.value; render(); } break;
    case 'att-chart': {
      setCurrentChart(t.value);
      const reh = state.rehearsals[ui.attDate];
      if (reh) { reh.chartId = t.value; setDoc(rehRef(ui.attDate), {chartId: t.value}, {merge:true}).catch(writeFailed); }
      render(); break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.dataset.submit === 'add-editor') {
    const em = (d.email || '').trim().toLowerCase();
    if (!em || em === session.access.owner || (session.access.editors || []).includes(em)) return;
    setDoc(accessRef, {...session.access, editors: [...(session.access.editors || []), em]}).catch(writeFailed);
    return;
  }
  const first = (d.first || '').trim(), last = (d.last || '').trim();
  if (!first || !last) return;
  if (f.dataset.submit === 'add-member') {
    state.members.push({id:uid(), first, last, part:d.part || '', active:true});
    commit();
    const inp = $('.addform input[name=first]'); if (inp) inp.focus();
  } else if (f.dataset.submit === 'save-member') {
    const m = member(f.dataset.id); m.first = first; m.last = last; closeModal(); commit();
  }
});

// ---------- drag & drop (pointer events, works with touch and mouse) ----------
let drag = null;
document.addEventListener('pointerdown', e => {
  if (ui.mode !== 'seating' || session.phase !== 'ready' || (e.button && e.button !== 0)) return;
  const el = e.target.closest('[data-member]'); if (!el) return;
  const seatEl = el.closest('[data-seat]');
  drag = { id: el.dataset.member, from: seatEl ? seatEl.dataset.seat : null, el, pid: e.pointerId,
           x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, started: false,
           inList: !!el.closest('.pool'), touch: e.pointerType !== 'mouse' };
  // In the scrolling list, a touch must either hold briefly or move sideways to start a drag (so vertical swipes still scroll).
  if (drag.touch && drag.inList) drag.timer = setTimeout(() => { if (drag && !drag.started) startDrag(); }, 200);
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const dx = drag.x - drag.x0, dy = drag.y - drag.y0, dist = Math.hypot(dx, dy);
  if (!drag.started) {
    if (drag.touch && drag.inList) { if (dist > 8) { if (Math.abs(dx) > Math.abs(dy)) startDrag(); else endDrag(); } }
    else if (dist > 6) startDrag();
    return;
  }
  moveGhost();
});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  endDrag();
  if (d.started) {
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const seatEl = target && target.closest('[data-seat]');
    if (seatEl) placeInSeat(d.id, seatEl.dataset.seat);
    else if (target && target.closest('.pool') && d.from) unseat(d.id);
    else if (renderQueued) render();
  } else {
    tapMember(d.id, d.from);
  }
});
window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(); });
document.addEventListener('touchmove', e => { if (drag && drag.started) e.preventDefault(); }, {passive:false});

function startDrag(){
  drag.started = true;
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  document.body.appendChild(g);
  drag.ghost = g; drag.w = r.width; drag.h = r.height;
  drag.el.classList.add('dragging');
  if (ui.selected) { ui.selected = null; document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); }
  moveGhost();
}
function moveGhost(){
  drag.ghost.style.transform = `translate(${drag.x - drag.w/2}px, ${drag.y - drag.h/2}px) scale(1.05)`;
  const t = document.elementFromPoint(drag.x, drag.y);
  const s = t && t.closest('[data-seat]');
  document.querySelectorAll('.seat.drop').forEach(x => { if (x !== s) x.classList.remove('drop'); });
  if (s) s.classList.add('drop');
}
function endDrag(){
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.ghost) drag.ghost.remove();
  drag.el.classList.remove('dragging');
  document.querySelectorAll('.seat.drop').forEach(x => x.classList.remove('drop'));
  drag = null;
  renderQueued = false;
}
function tapMember(id, fromSeat){
  if (ui.selected === id) { ui.selected = null; return render(); }
  if (fromSeat && ui.selected) return placeInSeat(ui.selected, fromSeat); // swap selected singer into this seat
  if (fromSeat) return showModal(() => memberModal(id));
  ui.selected = id; render();
}

// ---------- start ----------
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
